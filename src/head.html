<title>Data Structure Studio</title>
<style>
/* Deliberate single-theme design: a dark neon lab. Every color painted explicitly. */
:root{
  --paper:#0a0e17; --panel:#101624; --edge:#1f2a44; --ink:#dde6ff; --ink2:#8093bb;
  --accent:#2dd6ff; --accent-soft:#0d2a3a; --cur:#ffb020; --cur-soft:#2b2008;
  --fresh:#2fe6a0; --cut:#ff4d6d; --badge:#a78bfa; --node:#131b2e; --node-edge:#41547e;
  --rbred:#ff4d6d; --rbblack:#0b0f1a; --rbtext:#eef2ff; --chip:#182238;
}
*{box-sizing:border-box; margin:0}
html,body{height:100%}
body{
  background:var(--paper); color:var(--ink); overflow:hidden;
  font:14px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
#app{height:100vh; display:flex; flex-direction:column}

header.top{
  display:flex; align-items:center; gap:16px; padding:8px 14px 0;
  border-bottom:1px solid var(--edge); background:var(--panel); flex:none;
}
.brand{font-weight:700; letter-spacing:.16em; font-size:15px; padding-bottom:8px; white-space:nowrap; color:var(--accent); text-shadow:0 0 14px var(--accent-soft)}
.brand .sub{font-weight:400; letter-spacing:.02em; color:var(--ink2); font-size:12px; margin-left:8px}
@media (max-width: 1520px){ .brand .sub{display:none} }
@media (max-width: 1330px){ #tabs button{padding:9px 8px 11px; font-size:12px} .brand{letter-spacing:.1em} }
#tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
#tabs button{
  appearance:none; border:0; background:none; color:var(--ink2); cursor:pointer;
  font:600 12.5px/1 inherit; font-family:inherit; padding:9px 11px 11px; white-space:nowrap;
  border-bottom:2px solid transparent;
}
#tabs button:hover{color:var(--ink)}
#tabs button.on{color:var(--accent); border-bottom-color:var(--accent); text-shadow:0 0 12px var(--accent)}
#tabs button:focus-visible,.deck button:focus-visible,.deck input:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px; border-radius:3px;
}

.deck{
  display:flex; align-items:center; gap:14px; flex-wrap:nowrap;
  padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--edge); flex:none;
}
.deck label{display:flex; align-items:center; gap:6px; color:var(--ink2); font-size:12px; font-weight:600}
.deck input{
  width:64px; padding:6px 8px; border:1px solid var(--edge); border-radius:5px;
  background:var(--paper); color:var(--ink); caret-color:var(--accent);
  font:600 13.5px "Cascadia Code",Consolas,ui-monospace,monospace;
}
.deck input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 8px var(--accent-soft), 0 0 0 1px var(--accent)}
#ops{display:flex; gap:8px; flex-wrap:wrap}
.opgrp{
  display:inline-flex; align-items:center; gap:1px;
  background:var(--chip); border:1px solid var(--edge); border-radius:7px; padding:2px 3px 2px 0;
}
.opgrp .glabel{font-size:10px; font-weight:800; letter-spacing:.14em; color:var(--ink2); margin:0 6px 0 10px; user-select:none}
.opgrp[data-grp="add"] .glabel{color:var(--fresh)}
.opgrp[data-grp="del"] .glabel{color:var(--cut)}
.opgrp[data-grp="etc"] .glabel{color:var(--badge)}
.opgrp[data-grp="data"] .glabel{color:var(--accent)}
#ops button{
  appearance:none; cursor:pointer; border:0; border-radius:5px;
  background:transparent; color:var(--ink); font:600 13px/1 inherit; font-family:inherit;
  padding:8px 11px; white-space:nowrap;
}
#ops button:hover:not(:disabled){background:var(--panel); color:var(--accent); box-shadow:inset 0 0 0 1px var(--edge)}
.opgrp[data-grp="del"] button:hover:not(:disabled){color:var(--cut)}
.opgrp[data-grp="add"] button:hover:not(:disabled){color:var(--fresh)}
#ops button:disabled{opacity:.35; cursor:default}
.run{display:flex; align-items:center; gap:8px; margin-left:auto}
.run button{
  appearance:none; cursor:pointer; border:1px solid var(--edge); border-radius:5px;
  background:transparent; color:var(--ink); font:600 12px/1 inherit; font-family:inherit;
  padding:6px 10px; white-space:nowrap;
}
.run button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.run button:disabled{opacity:.35; cursor:default}
.run input[type=range]{width:90px; accent-color:var(--accent)}
.run .rlabel{font-size:11px; color:var(--ink2); font-weight:600}

main#stage{flex:1 1 0; min-height:0; position:relative}
#svg{position:absolute; inset:0; width:100%; height:100%; display:block}
body.logopen #svg{width:calc(100% - 292px)}

#log{
  position:absolute; top:8px; right:8px; bottom:8px; width:280px; display:none;
  flex-direction:column; background:var(--panel); border:1px solid var(--edge); border-radius:6px;
}
body.logopen #log{display:flex}
#log header{
  display:flex; align-items:center; justify-content:space-between;
  padding:7px 10px; border-bottom:1px solid var(--edge);
  font:700 10.5px inherit; font-family:inherit; letter-spacing:.12em; color:var(--ink2);
}
#log header button{appearance:none; border:0; background:none; color:var(--ink2); cursor:pointer; font-size:14px; line-height:1; padding:0 2px}
#log header button:hover{color:var(--ink)}
#logbody{flex:1; overflow-y:auto; padding:6px 8px; display:flex; flex-direction:column; gap:5px; scrollbar-width:thin; scrollbar-color:var(--edge) transparent}
.lentry{display:flex; gap:7px; align-items:baseline; font-size:12.5px; line-height:1.5; color:var(--ink)}
.lentry .lstep{
  flex:none; min-width:20px; text-align:right; color:var(--cur);
  font:700 11px "Cascadia Code",Consolas,ui-monospace,monospace; font-variant-numeric:tabular-nums;
}
.lentry b{color:var(--accent)}
.lentry.ldone{border-top:1px dashed var(--edge); padding-top:5px; margin-top:2px}
.lentry.ldone p{color:var(--accent); font-weight:650}
.lentry p{margin:0}
#msg code, .lentry code{
  background:var(--chip); color:var(--accent); border-radius:3px; padding:1px 5px;
  font:600 11px "Cascadia Code",Consolas,ui-monospace,monospace; white-space:nowrap;
}
.lentry code{white-space:pre-wrap; overflow-wrap:anywhere; display:inline}

.node rect,.node circle{fill:var(--node); stroke:var(--node-edge); stroke-width:1.5}
.node text{
  fill:var(--ink); font:600 16px "Cascadia Code",Consolas,ui-monospace,monospace;
  text-anchor:middle; dominant-baseline:central;
}
.node.hl rect,.node.hl circle{stroke:var(--cur); stroke-width:3; fill:var(--cur-soft); filter:drop-shadow(0 0 7px var(--cur))}
.node.hit rect,.node.hit circle{stroke:var(--fresh); stroke-width:3; filter:drop-shadow(0 0 7px var(--fresh))}
.node.doom rect,.node.doom circle{stroke:var(--cut); stroke-width:3; stroke-dasharray:5 3; filter:drop-shadow(0 0 7px var(--cut))}
.node.rb-r circle{fill:var(--rbred); stroke:var(--rbred)}
.node.rb-r text{fill:var(--rbtext)}
.node.rb-b circle{fill:var(--rbblack); stroke:var(--node-edge)}
.node.rb-b text{fill:var(--rbtext)}
.node .tag{font:600 10px "Cascadia Code",Consolas,ui-monospace,monospace; fill:var(--ink2)}
.edge{stroke:var(--node-edge); stroke-width:1.6; fill:none}
.edge.fresh{stroke:var(--fresh); stroke-width:2.6; filter:drop-shadow(0 0 4px var(--fresh))}
.edge.dying{stroke:var(--cut); stroke-width:2.2; stroke-dasharray:6 4; filter:drop-shadow(0 0 4px var(--cut))}
.edge.prevlane{opacity:.55}
.ptr text{font:700 11.5px "Cascadia Code",Consolas,ui-monospace,monospace; text-anchor:middle}
.ptr line{stroke-width:1.6}
.ptr.pcur text{fill:var(--cur); text-shadow:0 0 10px var(--cur)} .ptr.pcur line{stroke:var(--cur)}
.ptr.pbadge text{fill:var(--badge); text-shadow:0 0 10px var(--badge)} .ptr.pbadge line{stroke:var(--badge)}
.bucket rect{fill:none; stroke:var(--edge); stroke-width:1.2}
.bucket text{fill:var(--ink2); font:600 11px "Cascadia Code",Consolas,ui-monospace,monospace; text-anchor:middle; dominant-baseline:central}
.slotline{stroke:var(--edge); stroke-width:1}
.emptyhint{fill:var(--ink2); font:400 13px inherit; text-anchor:middle}

footer.status{
  flex:none; display:flex; align-items:center; gap:14px;
  padding:7px 14px; background:var(--panel); border-top:1px solid var(--edge);
}
#msg{flex:1 1 auto; min-width:0; font-size:13.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#msg b{color:var(--accent)}
#count{
  flex:none; font:700 13.5px "Cascadia Code",Consolas,ui-monospace,monospace;
  color:var(--cur); min-width:92px; text-align:right; font-variant-numeric:tabular-nums;
  text-shadow:0 0 10px var(--cur);
}
#bigo{flex:none; display:flex; gap:6px}
#bigo span{
  background:var(--chip); color:var(--ink2); border-radius:4px; padding:4px 8px;
  border:1px solid var(--edge);
  font:600 11.5px "Cascadia Code",Consolas,ui-monospace,monospace; white-space:nowrap;
}
#bigo span b{color:var(--accent); font-weight:700}
@media (prefers-reduced-motion: reduce){ #svg *{transition:none !important} }
</style>
<div id="app">
  <header class="top">
    <div class="brand">DATA STRUCTURE STUDIO<span class="sub">watch the links move</span></div>
    <nav id="tabs" aria-label="Data structures"></nav>
  </header>
  <section class="deck">
    <label>Value <input id="val" maxlength="4" spellcheck="false" placeholder="A1#"></label>
    <label title="0-based — the first node is index 0">Index <input id="idx" type="number" min="0" step="1" value="0"></label>
    <div id="ops"></div>
    <div class="run">
      <span class="rlabel">Speed</span>
      <input type="range" id="speed" min="1" max="30" value="10" aria-label="Animation speed">
      <button id="finish" title="Jump to end of animation">⏭ Finish</button>
      <button id="logbtn" title="Show or hide the operation log">☰ Log</button>
    </div>
  </section>
  <main id="stage">
    <svg id="svg" role="img" aria-label="Data structure visualization"></svg>
    <aside id="log" aria-label="Operation log">
      <header>OPERATION LOG<button id="logx" aria-label="Close log">×</button></header>
      <div id="logbody"></div>
    </aside>
  </main>
  <footer class="status">
    <div id="msg">Ready. Pick a structure, type a value, press an operation.</div>
    <div id="count">steps: 0</div>
    <div id="bigo"></div>
  </footer>
</div>
