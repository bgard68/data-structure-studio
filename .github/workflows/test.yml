name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build is byte-reproducible
        run: |
          node build.mjs
          git diff --exit-code app.html preview.html
          cmp preview.html index.html

      - name: Invariant fuzz suite
        run: node test/run.js
